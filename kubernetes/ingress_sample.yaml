apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-web-ingress
  namespace: library
spec:
  rules:
  - host: "library.example.com"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: "web"
            port:
              number: 3000
